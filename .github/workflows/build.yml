name: Build
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-15-intel
            platform: osx-x64
          - os: macos-26
            platform: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Prepare sandboxed Chromium on Linux
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          npx --yes playwright@1.63.0 install-deps chromium
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            browser_pattern="$GITHUB_WORKSPACE/artifacts/bundles/linux-x64-*/browsers/**/chrome"
            sudo tee /etc/apparmor.d/chatgpt-web-sdk-ci >/dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile chatgpt-web-sdk-ci "$browser_pattern" flags=(unconfined) {
            userns,
          }
          EOF
            sudo apparmor_parser -r /etc/apparmor.d/chatgpt-web-sdk-ci
          fi
      - name: Build SDK and extension packages
        timeout-minutes: 10
        shell: pwsh
        run: ./build.ps1 -SkipTests -BuildRoot artifacts/build
      - name: Prepare pinned Chromium bundle
        timeout-minutes: 10
        shell: pwsh
        run: ./tools/Bundle-Browser.ps1 -Stage Prepare
      - name: Verify native browser launch and rendering
        timeout-minutes: 3
        shell: pwsh
        run: ./tools/Bundle-Browser.ps1 -Stage Verify
      - name: Archive verified browser bundle
        timeout-minutes: 5
        shell: pwsh
        run: ./tools/Bundle-Browser.ps1 -Stage Archive
      - name: Validate Firefox extension
        if: matrix.platform == 'linux-x64'
        run: npx --yes web-ext@10.7.0 lint --source-dir artifacts/extensions/firefox --warnings-as-errors
      - name: Upload platform browser bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-${{ matrix.platform }}
          path: |
            artifacts/release/ChatGPTWebSdk-Bundle-${{ matrix.platform }}-*.zip
            artifacts/release/ChatGPTWebSdk-Bundle-${{ matrix.platform }}-*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload common SDK and extension assets
        if: matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-common
          path: |
            artifacts/release/*
            !artifacts/release/ChatGPTWebSdk-Bundle-*
            !artifacts/release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

name: Tests
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Validate version and commit message
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CHECK_COMMIT_VERSION: ${{ github.event_name != 'pull_request' }}
        run: |
          $taskVersion = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($taskVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid VERSION.' }
          if ($env:CHECK_COMMIT_VERSION -eq 'true') {
            $taskMessage = (git show -s --format=%B $env:RELEASE_COMMIT) -join [Environment]::NewLine
            if ($taskMessage -notmatch ('(?<![\d.])v?' + [regex]::Escape($taskVersion) + '(?![\d.])')) { throw "Mention version $taskVersion in the commit title or body." }
          }
      - name: Run SDK and extension tests before artifact builds
        shell: pwsh
        run: ./test.ps1 -BuildRoot artifacts/build

  build:
    needs: tests
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

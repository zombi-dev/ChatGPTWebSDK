name: Build SDK, extensions and release

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Validate release version and commit message
        id: version
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $taskVersion = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($taskVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid VERSION.' }
          $taskMessage = (git show -s --format=%B $env:RELEASE_COMMIT) -join [Environment]::NewLine
          if ($taskMessage -notmatch ('(?<![\d.])v?' + [regex]::Escape($taskVersion) + '(?![\d.])')) {
            throw "The commit title or body must mention release version $taskVersion. Bump VERSION and both extension manifests/package.json for each update."
          }
          "version=$taskVersion" >> $env:GITHUB_OUTPUT
      - name: Test and build all release assets
        shell: pwsh
        run: ./build.ps1 -BuildRoot artifacts/build
      - name: Validate Firefox extension
        run: npx --yes web-ext@10.7.0 lint --source-dir artifacts/extensions/firefox --warnings-as-errors
      - name: Upload SDK and extension release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.version.outputs.version }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14
    outputs:
      version: ${{ steps.version.outputs.version }}

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.build.outputs.version }}
          path: artifacts/release
      - name: Publish versioned release with all assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          cat > release-notes.md <<'NOTES'
          Source-compatible OpenAI .NET 2.14.0 clients backed by ChatGPT web endpoints.

          Install ChatGPTWebSdk.OpenAI from the attached NuGet packages or use the DLL bundle. The Chromium and Firefox authentication extensions copy one session string for OpenAI.ChatGPTWeb.Initialize(authenticationString).

          The Firefox XPI is unsigned: use a temporary installation in about:debugging. Permanent installation in normal Firefox requires Mozilla signing. See docs/AUTHENTICATION.md in the source for installation and session handling.

          Assets include all three NuGet packages, SDK DLLs and dependencies, the proxy, both extension ZIPs, the Firefox XPI, and SHA256SUMS.txt. The SDK DLL and proxy bundles include Playwright's driver, but do not bundle a browser. Hybrid mode can use an installed Chrome/Edge or an explicitly installed Playwright Chromium.
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            existing_commit=$(gh api "repos/${GH_REPO}/commits/${tag}" --jq .sha)
            if [ "$existing_commit" != "$RELEASE_COMMIT" ]; then
              echo "Refusing to replace a version already released from another commit. Bump VERSION."
              exit 1
            fi
            gh release upload "$tag" artifacts/release/* --clobber
          else
            gh release create "$tag" artifacts/release/* --target "$RELEASE_COMMIT" --title "ChatGPT Web SDK ${RELEASE_VERSION}" --notes-file release-notes.md
          fi

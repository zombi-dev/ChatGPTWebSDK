name: Release
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Verify the exact upstream test run
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          $taskBuild = gh api "repos/$env:GH_REPO/actions/runs/$env:BUILD_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $taskBuild.path -ne '.github/workflows/build.yml') { throw 'Unexpected build workflow.' }
          if ($taskBuild.display_title -notmatch '^Build after tests #(\d+)$') { throw 'Missing test run provenance.' }
          $taskTests = gh api "repos/$env:GH_REPO/actions/runs/$($Matches[1])" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $taskTests.path -ne '.github/workflows/tests.yml' -or $taskTests.conclusion -ne 'success' -or $taskTests.event -eq 'pull_request' -or $taskTests.head_repository.full_name -ne $env:GH_REPO) { throw 'Build did not follow successful repository tests.' }
          if ($taskTests.head_branch -ne 'main') { "publish=false" >> $env:GITHUB_OUTPUT; exit 0 }
          "publish=true" >> $env:GITHUB_OUTPUT
          "commit=$($taskTests.head_sha)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.source.outputs.publish == 'true'
        with:
          ref: ${{ steps.source.outputs.commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.source.outputs.publish == 'true'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: artifacts/release
          merge-multiple: true
      - name: Validate assets and publish release
        if: steps.source.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: ./tools/Publish-Release.ps1
